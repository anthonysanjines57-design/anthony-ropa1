<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ANTHONY | Ropa masculina</title>

  <meta name="description" content="ANTHONY - Ropa masculina moderna, cómoda y con estilo.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 6%;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 27px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
    }

    .hero {
      min-height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
      background:
        linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),
        url("https://images.unsplash.com/photo-1617127365659-c47fa864d8bc?auto=format&fit=crop&w=1600&q=80")
        center/cover;
      color: white;
    }

    .hero-content {
      max-width: 750px;
    }

    .hero small {
      letter-spacing: 4px;
      font-size: 13px;
    }

    .hero h1 {
      font-size: 65px;
      margin: 18px 0;
      letter-spacing: 4px;
    }

    .hero p {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      background: white;
      color: #111;
      padding: 14px 25px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 4px;
    }

    section {
      max-width: 1200px;
      margin: auto;
      padding: 65px 20px;
    }

    .section-title {
      text-align: center;
      margin-bottom: 40px;
    }

    .section-title h2 {
      font-size: 35px;
      margin-bottom: 10px;
    }

    .section-title p {
      color: #666;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px;
    }

    .card {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
      transition: .3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
    }

    .card-info {
      padding: 18px;
    }

    .card-info h3 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .card-info p {
      color: #777;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
    }

    .about {
      background: #111;
      color: white;
      max-width: none;
      text-align: center;
    }

    .about-content {
      max-width: 800px;
      margin: auto;
    }

    .about h2 {
      font-size: 35px;
      margin-bottom: 20px;
    }

    .about p {
      line-height: 1.8;
      color: #ddd;
    }

    .contact {
      text-align: center;
    }

    .whatsapp {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 25px;
      background: #25D366;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }

    footer {
      background: #111;
      color: #aaa;
      text-align: center;
      padding: 25px 15px;
      font-size: 13px;
    }

        grid-template-columns: repeat(2, 1fr);
